services:
  - type: web
    name: casa-pellas-ia-suite
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LOKY_MAX_CPU_COUNT
        value: "4"
